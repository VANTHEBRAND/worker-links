name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    # Limit this GitHub environment to the main branch before adding its deploy token.
    environment: production
    name: Worker Deploy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      name: Setup Node.js
      with:
        node-version: '18'
        cache: 'yarn'
    - name: Install dependencies
      run: yarn install --frozen-lockfile
    - name: Deploy Worker to Cloudflare
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.WORKER_LINKS_DEPLOY_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.WORKER_LINKS_ACCOUNT_ID }}
      run: yarn deploy
